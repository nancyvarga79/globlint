[project]
name = "globlint"
version = "0.1.0"
description = "A linter for glob pattern files that reports findings with line numbers."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "nancyvarga79"}]

[project.scripts]
globlint = "globlint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
